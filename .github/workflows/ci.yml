name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # La misma versión de npm que en desarrollo. Con otra, `npm ci` puede leer distinto el
      # package-lock y fallar por dependencias que la versión local no anota (pasó con @emnapi).
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
